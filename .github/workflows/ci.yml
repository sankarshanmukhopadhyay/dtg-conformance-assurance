name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate repo (schemas + CSV contracts)
        run: |
          make validate

      - name: Deterministic coverage report
        run: |
          make coverage

  docs-internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6


      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Validate Mermaid diagrams
        run: |
          set -euo pipefail
          awk '/```mermaid/{flag=1;next}/```/{if(flag){flag=0;exit}}flag{print}' docs/architecture.md > /tmp/architecture.mmd
          printf '%s\n' '{"args":["--no-sandbox"]}' > /tmp/puppeteer-config.json
          npx --yes @mermaid-js/mermaid-cli@10.9.1 \
            --puppeteerConfigFile /tmp/puppeteer-config.json \
            --input /tmp/architecture.mmd \
            --output /tmp/architecture.svg
          test -s /tmp/architecture.svg

      - name: Internal link check (no network)
        uses: lycheeverse/lychee-action@v2
        with:
          failIfEmpty: false
          args: >-
            --no-progress
            --verbose
            --include-fragments
            --offline
            --exclude-path docs/_config.yml
            docs/**/*.md README.md
