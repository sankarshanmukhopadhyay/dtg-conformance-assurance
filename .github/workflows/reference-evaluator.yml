name: DCAS reference evaluator

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Run evaluator and evidence integration tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Legacy ANAB example requires reassessment
        run: python tools/dcas_evaluate.py conformance/examples/anab_dcas_evaluation_input.example.json --expect INDETERMINATE
      - name: Execute synthetic Trust Tasks round trip
        run: |
          python conformance/examples/tt_conformance/generate_fixture.py /tmp/tt-fixture
          python tools/import_tt_conformance.py /tmp/tt-fixture/run.json /tmp/tt-fixture/results.json /tmp/tt-fixture/manifest.json --output /tmp/tt-fixture/input.json
          python tools/dcas_evaluate.py /tmp/tt-fixture/input.json --expect PASS
